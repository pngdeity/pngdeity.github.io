<!DOCTYPE html>
<html lang=en>
	<head>
		<title>Absent</title>
		<link rel='stylesheet' type='text/css' href='/style.css'>
		<meta charset='utf-8'>
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
      (function () {
        try {
          var t = localStorage.getItem('pg-theme');
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', t);
        } catch (e) {}
      })();
    </script>
    <script src="/theme.js" defer></script>
	</head>
	<body>
	<a href="#main-content" class="pg-skip-link">Skip to content</a>
	<button type="button" class="pg-theme-toggle" aria-pressed="false" aria-label="Switch to dark theme" title="Switch theme"><span class="pg-theme-toggle__icon pg-theme-toggle__icon--moon" aria-hidden="true">&#9789;</span><span class="pg-theme-toggle__icon pg-theme-toggle__icon--sun" aria-hidden="true">&#9728;</span></button>
