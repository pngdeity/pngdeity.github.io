<html lang="en"><head>
<meta http-equiv="content-type" content="text/html; charset=UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

		<link rel='stylesheet' type='text/css' href='/style.css'>
		<link rel="icon" href="/favicon.svg" type="image/svg+xml">
		<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
		<link rel="shortcut icon" href="/favicon.ico">
		<link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <style>
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        max-width: none;
        padding: 8px;
        font-family: sans-serif;
      }
      .wrap {
        display: block;
        text-align: center;
      }
      .brand {
        font-size: 1.5rem;
        font-weight: 400;
        letter-spacing: -0.01em;
        margin: 0 0 1em;
      }
      ul.links {
        display: block;
        list-style: none;
        margin: 0;
        padding: 0;
        font-size: 18px;
      }
      ul.links li {
        margin: 12px 0;
      }
      .copyright {
        font-size: 14px;
        margin-top: 2em;
      }
    </style>
    <script>
      (function () {
        try {
          var t = localStorage.getItem('pg-theme');
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', t);
        } catch (e) {}
      })();
    </script>
    <script src="/theme.js" defer></script>
	</head>

	<body>
		<a href="#main-content" class="pg-skip-link">Skip to content</a>
		<button type="button" class="pg-theme-toggle" aria-pressed="false" aria-label="Switch to dark theme" title="Switch theme"><span class="pg-theme-toggle__icon pg-theme-toggle__icon--moon" aria-hidden="true">&#9789;</span><span class="pg-theme-toggle__icon pg-theme-toggle__icon--sun" aria-hidden="true">&#9728;</span></button>
		<div class="wrap" id="main-content">
