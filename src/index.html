<!DOCTYPE html>
<html lang="en"><head>
<meta http-equiv="content-type" content="text/html; charset=UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>pngdeity</title>
		<link rel='stylesheet' type='text/css' href='/style.css'>
		<link rel="icon" href="/favicon.svg" type="image/svg+xml">
		<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
		<link rel="shortcut icon" href="/favicon.ico">
		<link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <style>
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        max-width: none;
        padding: 8px;
      }
      .wrap {
        display: grid;
        grid-template-columns: 1fr;
        gap: 1.75rem;
        align-items: center;
        max-width: 1100px;
      }
      .wrap figure {
        margin: 0;
      }
      .wrap img {
        display: block;
        width: 100%;
        height: auto;
        aspect-ratio: 2688 / 1568;
        object-fit: cover;
      }
      .portal {
        margin: 0;
        padding: 0;
        list-style: none;
        font-size: 16px;
      }
      .portal li {
        margin: 0.5rem 0 0.5rem 1.65em;
        text-indent: -1.65em;
      }
      .portal a::before {
        content: "[*]";
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 0.9em;
        color: var(--pg-fg-muted);
        margin-right: 0.6em;
      }
      @media (min-width: 48em) {
        .wrap {
          grid-template-columns: 1.6fr 1fr;
          gap: 2.5rem;
        }
        .wrap .intro {
          text-align: left;
        }
      }
    </style>
    <script>
      (function () {
        try {
          var t = localStorage.getItem('pg-theme');
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', t);
        } catch (e) {}
      })();
    </script>
    <script src="/theme.js" defer></script>
	</head>

	<body>
		<a href="#main-content" class="pg-skip-link">Skip to content</a>
		<button type="button" class="pg-theme-toggle" aria-pressed="false" aria-label="Switch to dark theme" title="Switch theme"><span class="pg-theme-toggle__icon pg-theme-toggle__icon--moon" aria-hidden="true">&#9789;</span><span class="pg-theme-toggle__icon pg-theme-toggle__icon--sun" aria-hidden="true">&#9728;</span></button>
		<div class="wrap" id="main-content">
			<figure>
				<img src="/pngdeity_files/gladstone-at-work.jpg" alt="Gladstone, a black cat wearing a bow tie, lying beside an open ThinkPad showing a tiled Linux desktop" width="2688" height="1568">
			</figure>
			<div class="intro">
				<h1 class="brand">pngdeity</h1>
				<figcaption>Through the portal.</figcaption>
				<ul class="portal">
					<li><a href="/blog/">Blog</a></li>
					<li><a href="/pngdeity_files/resume.pdf">Resumé</a></li>
					<li><a href="/pngdeity_files/vcard.vcf">Contact</a></li>
					<li><a href="/links.html">Links</a></li>
					<li><a href="/credits.html">Credits</a></li>
				</ul>
			</div>
		</div>
        </body>
</html>
