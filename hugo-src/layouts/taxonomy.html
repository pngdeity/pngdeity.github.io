{{ define "main" }}
  <article class="cf pa3 pa4-m pa4-l">
    <div class="measure-wide-l center f4 lh-copy nested-copy-line-height nested-links">
      {{ .Content }}
    </div>
  </article>
  <div class="mw8 center">
    <section class="ph4">
      {{ range .Data.Pages }}
        <h2 class="f2 lh-title">
          <a href="{{ .RelPermalink }}" class="link">
            {{ .LinkTitle }}
          </a>
        </h2>
        <p class="f6 gray">{{ len .Pages }} post{{ if ne (len .Pages) 1 }}s{{ end }}</p>
      {{ end }}
    </section>
  </div>
{{ end }}
